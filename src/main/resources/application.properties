
# ==============================================
# APPLICATION CONFIGURATION
# ==============================================

spring.application.name=SajiloChat
server.port=8080


# ==============================================
# MYSQL DATABASE CONFIGURATION
# ==============================================

spring.datasource.url=jdbc:mysql://localhost:3306/sajilochat_db?useSSL=false&serverTimezone=Asia/Kathmandu&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}


# ==============================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==============================================
# JACKSON CONFIGURATION
# ==============================================

# No additional Jackson configuration required yet.


# ==============================================
# ACTUATOR CONFIGURATION
# ==============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# ==============================================
# LOCAL CONFIGURATION IMPORT
# ==============================================

spring.config.import=optional:file:./application-local.properties


# ==============================================
# LOGGING CONFIGURATION
# ==============================================

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG


# ==============================================
# JWT CONFIGURATION
# ==============================================

app.jwt.secret=lHp24xJbC6cN/HiP17rZ916sjHcz2V5PogIYF5hygfY=
app.jwt.expiration-ms=900000


# ==============================================
# FILE UPLOAD CONFIGURATION
# ==============================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ==============================================
# ATTACHMENT STORAGE
# ==============================================

app.file.storage-dir=./uploads/attachments


# ==============================================
# FILE UPLOAD LOGGING
# ==============================================

logging.level.org.springframework.web.multipart=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
logging.level.org.apache.tomcat.util.http.fileupload=DEBUG
