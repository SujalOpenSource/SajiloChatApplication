
# ==============================================
# APPLICATION CONFIGURATION
# ==============================================

spring.application.name=SajiloChat
server.port=8080


# ==============================================
# MYSQL DATABASE CONFIGURATION
# ==============================================

spring.datasource.url=jdbc:mysql://localhost:3306/sajilochat_db?useSSL=false&serverTimezone=Asia/Kathmandu&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}


# ==============================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================

# Automatically create and update database tables
spring.jpa.hibernate.ddl-auto=update

# SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View
spring.jpa.open-in-view=false


# ==============================================
# JACKSON CONFIGURATION
# ==============================================

# No additional Jackson configuration required yet.


# ==============================================
# ACTUATOR CONFIGURATION
# ==============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# ==============================================
# LOCAL CONFIGURATION IMPORT
# ==============================================

spring.config.import=optional:file:./application-local.properties

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

JWT_SECRET=1FV2WK6byGvzw09LIuqJ5MNIqInORWgXwIWgMNPtNGU=

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
